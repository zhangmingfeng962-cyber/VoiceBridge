user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  client_max_body_size 4k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=room_create:1m rate=4r/m;
  server {
    listen 80 default_server;
    server_name voicebridge-room.cn;
    location /.well-known/acme-challenge/ { root /var/www/voicebridge-acme; default_type text/plain; }
    location / { return 301 https://voicebridge-room.cn$request_uri; }
  }
  server {
    listen 443 ssl default_server;
    server_name voicebridge-room.cn;
    ssl_certificate /etc/letsencrypt/live/voicebridge-room.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voicebridge-room.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VoiceBridgeTLS:2m;
    if ($host != voicebridge-room.cn) { return 444; }
    location = /downloads/VoiceBridge.exe {
      alias /opt/voicebridge/downloads/VoiceBridge.exe;
      default_type application/octet-stream;
      add_header Content-Disposition 'attachment; filename="VoiceBridge.exe"';
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control 'no-cache';
      limit_conn download_per_ip 2;
      limit_rate 512k;
    }
    location = /api/rooms {
      limit_req zone=room_create burst=3 nodelay;
      limit_req_status 429;
      include /etc/voicebridge/proxy-room.inc;
    }
    location / { include /etc/voicebridge/proxy-room.inc; }
  }
  limit_conn_zone $binary_remote_addr zone=download_per_ip:1m;
}
