<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人资料 · VoiceBridge</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico"><link rel="stylesheet" href="/account.css"><script type="module" src="/account.js"></script></head><body><main class="profilePage"><a class="brand" href="/"><img src="/brand.svg" alt="">VoiceBridge</a><a class="backLink" href="/">返回大厅</a><h1>个人资料</h1><p class="quiet">头像和昵称会同步到你登录的设备，房间里的人能认出你。</p><form id="profileForm"><div class="profileHead"><img id="profileAvatar" class="avatarPreview" alt="你的头像" hidden><strong id="profileInitial" class="initialAvatar"></strong><span id="accountId" class="quiet"></span></div><label for="profileNickname">昵称</label><input id="profileNickname" maxlength="20" autocomplete="nickname" required><label for="profileFile">更换头像</label><input id="profileFile" type="file" accept="image/png,image/jpeg,image/webp"><button class="primary" id="saveProfile" type="submit">保存资料</button></form><details class="passwordSettings"><summary>修改密码</summary><form id="passwordForm"><label for="oldPassword">当前密码</label><input id="oldPassword" type="password" autocomplete="current-password" required><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" maxlength="128" required><label for="newPasswordAgain">再次输入新密码</label><input id="newPasswordAgain" type="password" autocomplete="new-password" maxlength="128" required><p class="quiet">15–128 个字符，支持中文、空格和密码管理器。</p><button id="changePassword" type="submit">保存新密码</button></form></details><p id="profileStatus" class="formMessage" role="status"></p><button id="logout" class="secondary">退出登录</button></main></body></html>
