<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · VoiceBridge</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="/favicon.ico"><meta name="theme-color" content="#000000"><link rel="stylesheet" href="/account.css"><script type="module" src="/login.js"></script></head><body>
<main class="identityLayout"><aside class="identityIntro"><a class="brand" href="/"><img src="/brand.svg" alt="">VoiceBridge</a><div><p class="eyebrow">一起听，一起聊</p><h1>朋友认得出你，<br>进房就能开聊。</h1><p>用同一个账号保存头像和昵称。<br>游戏连麦，音乐共享，都在一个房间里。</p></div><p class="quiet">Windows 软件与网页使用同一个账号。</p></aside>
<section class="identityCard" aria-labelledby="authTitle"><nav class="authTabs" aria-label="账号操作"><button id="loginTab" aria-pressed="true" type="button">登录</button><button id="registerTab" aria-pressed="false" type="button">注册</button></nav><h2 id="authTitle">欢迎回来</h2><p id="authHint" class="quiet">邮箱和密码登录，不必重复收取验证码。</p><form id="authForm">
<div id="emailStep"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" maxlength="254" required placeholder="你的邮箱地址"><div id="codeStep" hidden><label for="code">邮箱验证码</label><div class="codeRow"><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"><button id="sendCode" type="button" class="secondary">获取验证码</button></div><p class="quiet">五分钟内有效。没有收到时请检查垃圾邮件。</p></div></div>
<div id="passwordStep"><label for="password">密码</label><div class="passwordRow"><input id="password" type="password" autocomplete="current-password" maxlength="128" required><button type="button" id="showPassword" class="secondary" aria-label="显示密码" aria-pressed="false">显示</button></div><div id="setupFields" hidden><p class="quiet">15–128 个字符。可以是一段容易记住的短语，不强制符号组合。</p><label for="confirmPassword">确认密码</label><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128"><div id="registerProfile"><label for="nickname">昵称</label><input id="nickname" type="text" maxlength="20" autocomplete="nickname"><label for="avatar">头像（可稍后设置）</label><input id="avatar" type="file" accept="image/png,image/jpeg,image/webp"><img id="avatarPreview" class="avatarPreview" alt="头像预览" hidden></div></div></div>
<p id="authError" role="status" class="formMessage" aria-live="polite"></p><button id="submitAuth" class="primary" type="submit">登录</button><button id="forgotPassword" class="textButton" type="button">忘记密码？</button><p class="quiet small">保持登录状态 30 天。请仅在自己的设备上使用自动登录。</p></form><a class="backLink" href="/">返回大厅</a></section></main></body></html>
