name: Publish portable 0.10.0 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-portable-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.10.0
      - name: Package and publish canonical source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source artifacts/original
          if gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'VoiceBridge-v0.10.0-source-portable.zip'; then
            echo 'Portable source already verified and published'
            exit 0
          fi
          gh release download v0.10.0 --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir artifacts/original
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,re
          root=pathlib.Path('.')
          allowed=['.gitattributes','.gitignore','CHANGELOG.md','Directory.Build.props','global.json','LICENSE','README.md','VoiceBridge.sln','src','tests','scripts','third-party','docs','relay']
          files=[]
          for name in allowed:
              p=root/name
              for f in sorted(p.rglob('*')) if p.is_dir() else [p]:
                  if not f.is_file(): continue
                  rel=f.relative_to(root)
                  if any(x in {'bin','obj','node_modules','.git','artifacts'} for x in rel.parts): continue
                  if f.suffix in {'.exe','.pdb','.zip','.pem','.vbrelay'}: raise ValueError(str(rel))
                  files.append((f,rel))
          assert len(files)==77,len(files)
          target=pathlib.Path('artifacts/source/VoiceBridge-v0.10.0-source-portable.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f,rel in files:
                  data=f.read_bytes()
                  if f.suffix=='.sh':
                      data=data.replace(b'\r\n',b'\n')
                      assert b'\r' not in data
                  z.writestr('VoiceBridge/'+rel.as_posix(),data)
          lines=pathlib.Path('artifacts/original/SHA256SUMS.txt').read_text().splitlines()
          exe=[line for line in lines if re.fullmatch(r'[a-f0-9]{64}  VoiceBridge-v0\.10\.0\.exe',line)]
          assert len(exe)==1
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          pathlib.Path('artifacts/source/SHA256SUMS-portable.txt').write_text(digest+'  '+target.name+'\n'+exe[0]+'\n')
          print('PORTABLE_SOURCE_77_FILES_LF_OK',digest)
          PY
          gh release upload v0.10.0 --repo "$GITHUB_REPOSITORY" artifacts/source/VoiceBridge-v0.10.0-source-portable.zip artifacts/source/SHA256SUMS-portable.txt
          gh release view v0.10.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > artifacts/source/notes.md
          printf '\n\n源码推荐下载 VoiceBridge-v0.10.0-source-portable.zip，并用 SHA256SUMS-portable.txt 校验。此包保留项目隐藏文件和 Linux 脚本 LF 换行，原 Windows 打包版继续保留。\n' >> artifacts/source/notes.md
          gh release edit v0.10.0 --repo "$GITHUB_REPOSITORY" --notes-file artifacts/source/notes.md
          cat artifacts/source/SHA256SUMS-portable.txt >> "$GITHUB_STEP_SUMMARY"

  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Transfer verified client in bounded compressed chunks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/client
          gh release download v0.10.0 --repo "$GITHUB_REPOSITORY" --pattern VoiceBridge-v0.10.0.exe --dir artifacts/client
          python3 - <<'PY'
          import os,pathlib,hashlib,gzip,json,base64,urllib.request,urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def api(path,payload=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=json.dumps(payload).encode() if payload is not None else None,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST' if payload is not None else 'GET')
              with urllib.request.urlopen(request,timeout=120) as result:return json.load(result)
          data=pathlib.Path('artifacts/client/VoiceBridge-v0.10.0.exe').read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='aab537626db179ac63324fcf282a916f38491f8c43e9d4ab08a858cccc57a389'
          packed=gzip.compress(data,compresslevel=9,mtime=0)
          meta={'encoding':'chunks-gzip-v1','version':'0.10.0','exeSha256':digest,'bytes':len(data),'gzipSha256':hashlib.sha256(packed).hexdigest(),'gzipBytes':len(packed),'chunks':[]}
          for index,offset in enumerate(range(0,len(packed),2*1024*1024)):
              chunk=packed[offset:offset+2*1024*1024]
              created=api('git/blobs',{'encoding':'base64','content':base64.b64encode(chunk).decode()})
              meta['chunks'].append({'blob':created['sha'],'bytes':len(chunk),'sha256':hashlib.sha256(chunk).hexdigest()})
              print('CHUNK_READY',index,len(chunk),flush=True)
          content=json.dumps(meta,indent=2)+'\n'
          endpoint='contents/deployment/client-transfer-0.10.0.json'
          payload={'message':'Record verified compressed client chunks for deployment','branch':'main','content':base64.b64encode(content.encode()).decode()}
          try:payload['sha']=api(endpoint)['sha']
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
          request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+endpoint,data=json.dumps(payload).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='PUT')
          with urllib.request.urlopen(request,timeout=120) as result:json.load(result)
          print('VERIFIED_COMPRESSED_CLIENT_READY',len(meta['chunks']),meta['gzipBytes'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:summary.write(content)
          PY
