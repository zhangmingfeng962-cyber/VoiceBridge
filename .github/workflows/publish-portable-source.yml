name: Publish portable 0.10.0 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-portable-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.10.0
      - name: Package canonical source with Unix shell line endings
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & scripts/Package-Preview.ps1 -OutputDirectory artifacts/source
          $source = Join-Path $PWD 'artifacts/source/VoiceBridge-v0.10.0-source.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($source)
          try {
            $entries = @($archive.Entries | Where-Object {$_.Name})
            if ($entries.Count -ne 77) { throw 'Unexpected source file count' }
            foreach ($entry in $entries | Where-Object {$_.Name.EndsWith('.sh')}) {
              $reader = [IO.StreamReader]::new($entry.Open())
              try { if ($reader.ReadToEnd().Contains("`r")) { throw 'Shell source has CR characters' } } finally { $reader.Dispose() }
            }
          } finally { $archive.Dispose() }
          $portable = Join-Path $PWD 'artifacts/source/VoiceBridge-v0.10.0-source-portable.zip'
          Move-Item -LiteralPath $source -Destination $portable
          gh release download v0.10.0 --repo "$env:GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir artifacts/original
          $exe = @(Get-Content artifacts/original/SHA256SUMS.txt | Where-Object {$_ -match '^[a-f0-9]{64}  VoiceBridge-v0\.10\.0\.exe$'})
          if ($exe.Count -ne 1) { throw 'Missing original client checksum' }
          $sourceHash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          $checks = @("$sourceHash  VoiceBridge-v0.10.0-source-portable.zip", $exe[0])
          [IO.File]::WriteAllLines((Join-Path $PWD 'artifacts/source/SHA256SUMS-portable.txt'), $checks, [Text.Encoding]::ASCII)
          gh release upload v0.10.0 --repo "$env:GITHUB_REPOSITORY" artifacts/source/VoiceBridge-v0.10.0-source-portable.zip artifacts/source/SHA256SUMS-portable.txt
          $body = (gh release view v0.10.0 --repo "$env:GITHUB_REPOSITORY" --json body --jq .body) -join "`n"
          $body += "`n`n源码推荐下载 VoiceBridge-v0.10.0-source-portable.zip，并使用 SHA256SUMS-portable.txt 校验。它与标签源码一致，保留 Linux 部署脚本的原始 LF 换行；原 Windows 打包版继续保留。"
          [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/source/notes.md'), $body, [Text.UTF8Encoding]::new($false))
          gh release edit v0.10.0 --repo "$env:GITHUB_REPOSITORY" --notes-file artifacts/source/notes.md
          $checks | Add-Content $env:GITHUB_STEP_SUMMARY
