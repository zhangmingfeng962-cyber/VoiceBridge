name: Validate VoiceBridge 0.11
on:
  push:
    branches: [voicebridge-0.11.0]
    paths: ['.github/workflows/validate-0.11.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Restore and validate source and native library
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          if((Get-FileHash src/VoiceBridge.App/Native/voicebridge-rnnoise.dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8bcf99aee95f01ab6b6f073304dfc0e25e416b254b6ea2f0cd5faa7630b41a02'){throw 'Native dependency integrity mismatch'}
          Push-Location relay
          npm ci --ignore-scripts
          npm test
          Pop-Location
          dotnet restore VoiceBridge.sln --locked-mode
          dotnet test VoiceBridge.sln -c Release --no-restore --nologo
          dotnet publish src/VoiceBridge.App/VoiceBridge.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/win-x64
          $report=Join-Path $PWD 'artifacts/single-file-report.json'
          $child=Start-Process -FilePath (Join-Path $PWD 'artifacts/win-x64/VoiceBridge.exe') -ArgumentList @('--self-test',$report) -PassThru -WindowStyle Hidden
          if(!$child.WaitForExit(25000) -or $child.ExitCode -ne 0){throw 'Single EXE diagnostic failed'}
          Get-Content $report
          & scripts/Package-Preview.ps1 -ExecutablePath artifacts/win-x64/VoiceBridge.exe -OutputDirectory artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-0.11-validated
          path: |
            artifacts/release/*
            artifacts/single-file-report.json
