name: Import verified source archive

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify and import the public source archive
        shell: python
        run: |
          import hashlib, pathlib, shutil, subprocess, sys, tempfile, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'VoiceBridge-v0.7.0-source.zip'
          expected = '0e8f7676a28248fecd35ae0043685a3c7d0b7c536af1131471c51a89d2cb34bb'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise RuntimeError('The source archive checksum does not match the reviewed release.')
          marker = root / '.source-import-sha256'
          if marker.is_file() and marker.read_text().strip() == expected:
              print('This verified source was already imported; preserving subsequent edits.')
              sys.exit(0)
          allowed = {'.gitattributes', '.gitignore', 'CHANGELOG.md', 'Directory.Build.props', 'global.json', 'LICENSE', 'README.md', 'README.zh-CN.md', 'VoiceBridge.sln', 'src', 'tests', 'scripts', 'third-party', 'docs', 'relay'}
          with tempfile.TemporaryDirectory() as temporary:
              unpacked = pathlib.Path(temporary).resolve()
              with zipfile.ZipFile(archive) as source_zip:
                  for member in source_zip.infolist():
                      target = (unpacked / member.filename).resolve()
                      if not target.is_relative_to(unpacked):
                          raise RuntimeError('Unsafe path in source archive.')
                  source_zip.extractall(unpacked)
              source = unpacked / 'VoiceBridge'
              if not (source / 'VoiceBridge.sln').is_file():
                  raise RuntimeError('The complete project is missing from the archive.')
              count = 0
              for file in source.rglob('*'):
                  if not file.is_file():
                      continue
                  relative = file.relative_to(source)
                  if relative.parts[0] not in allowed or any(part in {'.git', 'bin', 'obj', 'artifacts'} for part in relative.parts):
                      raise RuntimeError('Unexpected file in source archive.')
                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(file, destination)
                  count += 1
          marker.write_text(expected + '\n')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--all'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'commit', '-m', 'Release HTTPS relay with continuous WAN buffering'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          print(f'Imported {count} reviewed source files.')
